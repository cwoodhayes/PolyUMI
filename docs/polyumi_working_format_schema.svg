<svg width="100%" viewBox="0 0 680 1048" role="img" xmlns="http://www.w3.org/2000/svg" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
<title>PolyUMI pzarr working format</title>
<desc>A scene-level zarr v2 store with one group per episode, per-stream timestamps at native rates, derived poses and annotations written by six preprocessing steps, mp4 and SLAM-atlas sidecars, and the ReplayBuffer / MCAP export targets.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="1048" fill="rgb(20, 20, 19)"/>
<!-- LEFT: the store itself -->
<rect x="20" y="20" width="420" height="884" rx="14" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/>
<rect x="36" y="212" width="390" height="600" rx="10" fill="rgb(12, 68, 124)" stroke="rgb(133, 183, 235)" stroke-width="0.5"/>
<text x="36" y="48" fill="rgb(159, 225, 203)" font-size="14" font-weight="500">scene.zarr/</text>
<text x="36" y="64" fill="rgb(93, 202, 165)" font-size="12" font-weight="400">zarr v2 DirectoryStore · every step writes in place</text>
<rect x="40" y="80" width="380" height="96" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/>
<text x="56" y="100" fill="rgb(211, 209, 199)" font-size="14" font-weight="500">.zattrs (scene)</text>
<text x="56" y="116" fill="rgb(180, 178, 169)" font-size="12" font-weight="400">task · date · n_episodes · created_at</text>
<text x="56" y="132" fill="rgb(180, 178, 169)" font-size="12" font-weight="400">pzarr_version · pipeline_version · git_sha</text>
<text x="56" y="148" fill="rgb(180, 178, 169)" font-size="12" font-weight="400">preprocessing_steps — which steps have run</text>
<text x="56" y="164" fill="rgb(180, 178, 169)" font-size="12" font-weight="400">gripper_calib · optitrack_to_slam_transform</text>
<text x="36" y="202" fill="rgb(250, 249, 245)" font-size="14" font-weight="500">episode_0/ … episode_N/ — one group per recorded session</text>
<rect x="52" y="226" width="358" height="64" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/>
<text x="68" y="246" fill="rgb(211, 209, 199)" font-size="14" font-weight="500">.zattrs (per-episode)</text>
<text x="68" y="262" fill="rgb(180, 178, 169)" font-size="12" font-weight="400">session_type: MAPPING | EPISODE · session_dir</text>
<text x="68" y="278" fill="rgb(180, 178, 169)" font-size="12" font-weight="400">preprocessing_steps — per-episode marks</text>
<rect x="52" y="302" width="358" height="96" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/>
<text x="68" y="322" fill="rgb(250, 199, 117)" font-size="14" font-weight="500">timestamps/</text>
<text x="68" y="338" fill="rgb(239, 159, 39)" font-size="12" font-weight="400">float64 absolute UTC seconds, one array per stream</text>
<text x="68" y="354" fill="rgb(239, 159, 39)" font-size="12" font-weight="400">finger · finger_piezo · finger_air</text>
<text x="68" y="370" fill="rgb(239, 159, 39)" font-size="12" font-weight="400">gopro · gopro_audio · gopro_accl/gyro/gps</text>
<text x="68" y="386" fill="rgb(239, 159, 39)" font-size="12" font-weight="400">native rates, never resampled — searchsorted at read</text>
<rect x="52" y="410" width="358" height="80" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/>
<text x="68" y="430" fill="rgb(245, 196, 179)" font-size="14" font-weight="500">gopro/</text>
<text x="68" y="446" fill="rgb(240, 153, 123)" font-size="12" font-weight="400">frames: not stored — decoded on demand from gopro.mp4</text>
<text x="68" y="462" fill="rgb(240, 153, 123)" font-size="12" font-weight="400">audio f32 · accl, gyro (N,3) f64 · gps (N,3) f64</text>
<text x="68" y="478" fill="rgb(240, 153, 123)" font-size="12" font-weight="400">slam_poses (N,7) f64 — optical frame, NaN when lost</text>
<rect x="52" y="502" width="358" height="80" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/>
<text x="68" y="522" fill="rgb(245, 196, 179)" font-size="14" font-weight="500">finger/</text>
<text x="68" y="538" fill="rgb(240, 153, 123)" font-size="12" font-weight="400">frames (N,H,W,3) uint8 — JpegXl, one frame per chunk</text>
<text x="68" y="554" fill="rgb(240, 153, 123)" font-size="12" font-weight="400">finger_piezo (contact mic) · finger_air (air mic + chirp)</text>
<text x="68" y="570" fill="rgb(240, 153, 123)" font-size="12" font-weight="400">both f32 at 16 kHz, Blosc-zstd</text>
<rect x="52" y="594" width="358" height="80" rx="8" fill="rgb(39, 80, 10)" stroke="rgb(151, 196, 89)" stroke-width="0.5"/>
<text x="68" y="614" fill="rgb(192, 221, 151)" font-size="14" font-weight="500">eef/          ← step 5</text>
<text x="68" y="630" fill="rgb(151, 196, 89)" font-size="12" font-weight="400">pose_slam · pose_optitrack   (N_gopro, 7) f64</text>
<text x="68" y="646" fill="rgb(151, 196, 89)" font-size="12" font-weight="400">the hand frame, on the GoPro frame grid; NaN = unsolved</text>
<text x="68" y="662" fill="rgb(151, 196, 89)" font-size="12" font-weight="400">one array per source — export picks which to train on</text>
<rect x="52" y="686" width="358" height="112" rx="8" fill="rgb(39, 80, 10)" stroke="rgb(151, 196, 89)" stroke-width="0.5"/>
<text x="68" y="706" fill="rgb(192, 221, 151)" font-size="14" font-weight="500">annotations/</text>
<text x="68" y="722" fill="rgb(151, 196, 89)" font-size="12" font-weight="400">episode_start, episode_end — scalar f64</text>
<text x="68" y="738" fill="rgb(151, 196, 89)" font-size="12" font-weight="400">time_sync/ ← 1     chirp offset, GoPro clock → Pi clock</text>
<text x="68" y="754" fill="rgb(151, 196, 89)" font-size="12" font-weight="400">slam/ ← 2     tracking counts, atlas path</text>
<text x="68" y="770" fill="rgb(151, 196, 89)" font-size="12" font-weight="400">gripper_width/ ← 4     width_m over the GoPro frame grid</text>
<text x="68" y="786" fill="rgb(151, 196, 89)" font-size="12" font-weight="400">contact_audio/ ← 6     piezo blocks, one per GoPro frame</text>
<rect x="40" y="826" width="380" height="64" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/>
<text x="56" y="846" fill="rgb(245, 196, 179)" font-size="14" font-weight="500">optitrack/   (scene-level)</text>
<text x="56" y="862" fill="rgb(240, 153, 123)" font-size="12" font-weight="400">pose (N,7) f64 · timestamps (N,) f64</text>
<text x="56" y="878" fill="rgb(240, 153, 123)" font-size="12" font-weight="400">written at ingest, only when a mocap CSV is present</text>
<!-- RIGHT: sidecars, steps, exports -->
<text x="460" y="36" fill="rgb(250, 249, 245)" font-size="14" font-weight="500">Sidecars (beside the zarr)</text>
<rect x="456" y="48" width="204" height="80" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/>
<text x="558" y="68" fill="rgb(211, 209, 199)" font-size="14" font-weight="500" text-anchor="middle">session_*/gopro.mp4</text>
<text x="558" y="84" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">load-bearing — every GoPro</text>
<text x="558" y="100" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">frame is decoded from it</text>
<text x="558" y="116" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">finger.mp4 is convenience</text>
<rect x="456" y="140" width="204" height="48" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/>
<text x="558" y="160" fill="rgb(211, 209, 199)" font-size="14" font-weight="500" text-anchor="middle">&lt;scene&gt;.atlas.osa</text>
<text x="558" y="176" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">ORB-SLAM3 map · optional</text>
<text x="460" y="222" fill="rgb(250, 249, 245)" font-size="14" font-weight="500">Preprocessing steps</text>
<text x="460" y="238" fill="rgb(194, 192, 182)" font-size="12" font-weight="400">pingest pp &lt;n&gt; — writes in place</text>
<rect x="456" y="250" width="204" height="48" rx="6" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
<text x="558" y="270" fill="rgb(206, 203, 246)" font-size="14" font-weight="500" text-anchor="middle">1. chirp-time-sync</text>
<text x="558" y="286" fill="rgb(175, 169, 236)" font-size="12" font-weight="400" text-anchor="middle">→ annotations/time_sync/</text>
<line x1="558" y1="298" x2="558" y2="310" stroke="rgb(194, 192, 182)" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="456" y="310" width="204" height="48" rx="6" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
<text x="558" y="330" fill="rgb(206, 203, 246)" font-size="14" font-weight="500" text-anchor="middle">2. orb-slam3</text>
<text x="558" y="346" fill="rgb(175, 169, 236)" font-size="12" font-weight="400" text-anchor="middle">→ gopro/slam_poses, .osa</text>
<line x1="558" y1="358" x2="558" y2="370" stroke="rgb(194, 192, 182)" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="456" y="370" width="204" height="48" rx="6" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
<text x="558" y="390" fill="rgb(206, 203, 246)" font-size="14" font-weight="500" text-anchor="middle">3. slam-optitrack-align</text>
<text x="558" y="406" fill="rgb(175, 169, 236)" font-size="12" font-weight="400" text-anchor="middle">→ transform in scene .zattrs</text>
<line x1="558" y1="418" x2="558" y2="430" stroke="rgb(194, 192, 182)" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="456" y="430" width="204" height="48" rx="6" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
<text x="558" y="450" fill="rgb(206, 203, 246)" font-size="14" font-weight="500" text-anchor="middle">4. aruco-gripper-width</text>
<text x="558" y="466" fill="rgb(175, 169, 236)" font-size="12" font-weight="400" text-anchor="middle">→ annotations/gripper_width/</text>
<line x1="558" y1="478" x2="558" y2="490" stroke="rgb(194, 192, 182)" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="456" y="490" width="204" height="48" rx="6" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
<text x="558" y="510" fill="rgb(206, 203, 246)" font-size="14" font-weight="500" text-anchor="middle">5. eef-pose</text>
<text x="558" y="526" fill="rgb(175, 169, 236)" font-size="12" font-weight="400" text-anchor="middle">→ eef/pose_&lt;source&gt;</text>
<line x1="558" y1="538" x2="558" y2="550" stroke="rgb(194, 192, 182)" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="456" y="550" width="204" height="48" rx="6" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
<text x="558" y="570" fill="rgb(206, 203, 246)" font-size="14" font-weight="500" text-anchor="middle">6. contact-audio</text>
<text x="558" y="586" fill="rgb(175, 169, 236)" font-size="12" font-weight="400" text-anchor="middle">→ annotations/contact_audio/</text>
<text x="460" y="632" fill="rgb(250, 249, 245)" font-size="14" font-weight="500">Export targets</text>
<rect x="456" y="644" width="204" height="96" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/>
<text x="558" y="664" fill="rgb(211, 209, 199)" font-size="14" font-weight="500" text-anchor="middle">pingest export --type dp</text>
<text x="558" y="680" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">UMI ReplayBuffer .zarr.zip</text>
<text x="558" y="696" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">camera0_rgb (T,224,224,3)</text>
<text x="558" y="712" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">robot0_eef_* · gripper_width</text>
<text x="558" y="728" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">meta/episode_ends</text>
<rect x="456" y="752" width="204" height="80" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/>
<text x="558" y="772" fill="rgb(211, 209, 199)" font-size="14" font-weight="500" text-anchor="middle">… --type polyumi</text>
<text x="558" y="788" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">the same, plus</text>
<text x="558" y="804" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">data/mic_0 (contact mic)</text>
<text x="558" y="820" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">data/finger_rgb (cropped)</text>
<rect x="456" y="844" width="204" height="64" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/>
<text x="558" y="864" fill="rgb(211, 209, 199)" font-size="14" font-weight="500" text-anchor="middle">pingest export-mcap</text>
<text x="558" y="880" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">one .mcap per episode</text>
<text x="558" y="896" fill="rgb(180, 178, 169)" font-size="12" font-weight="400" text-anchor="middle">Foxglove JSON schemas</text>
<rect x="20" y="928" width="640" height="64" rx="8" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/>
<text x="36" y="948" fill="rgb(159, 225, 203)" font-size="14" font-weight="500">At-rest archive — pingest archive-scene</text>
<text x="36" y="964" fill="rgb(93, 202, 165)" font-size="12" font-weight="400">scene.zarr + every session_*/gopro.mp4 + the .osa atlas → one &lt;scene&gt;.zarr.zip, stored uncompressed</text>
<text x="36" y="980" fill="rgb(93, 202, 165)" font-size="12" font-weight="400">the mp4s have to travel with it: GoPro frames live nowhere else</text>
<rect x="20" y="1014" width="14" height="14" rx="3" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/>
<text x="40" y="1025" fill="rgb(194, 192, 182)" font-size="12" font-weight="400">scene · archive</text>
<rect x="143" y="1014" width="14" height="14" rx="3" fill="rgb(12, 68, 124)" stroke="rgb(133, 183, 235)" stroke-width="0.5"/>
<text x="163" y="1025" fill="rgb(194, 192, 182)" font-size="12" font-weight="400">episode</text>
<rect x="217" y="1014" width="14" height="14" rx="3" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/>
<text x="237" y="1025" fill="rgb(194, 192, 182)" font-size="12" font-weight="400">timestamps</text>
<rect x="310" y="1014" width="14" height="14" rx="3" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/>
<text x="330" y="1025" fill="rgb(194, 192, 182)" font-size="12" font-weight="400">sensor data</text>
<rect x="409" y="1014" width="14" height="14" rx="3" fill="rgb(39, 80, 10)" stroke="rgb(151, 196, 89)" stroke-width="0.5"/>
<text x="429" y="1025" fill="rgb(194, 192, 182)" font-size="12" font-weight="400">derived</text>
<rect x="483" y="1014" width="14" height="14" rx="3" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
<text x="503" y="1025" fill="rgb(194, 192, 182)" font-size="12" font-weight="400">step</text>
<rect x="539" y="1014" width="14" height="14" rx="3" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/>
<text x="559" y="1025" fill="rgb(194, 192, 182)" font-size="12" font-weight="400">sidecar · export</text>
</svg>
