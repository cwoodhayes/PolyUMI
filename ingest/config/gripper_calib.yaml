
# calibrates the transforms between the pose the optitrack reports
# for the gripper, and the actual gripper.
# necessary because Motive just picks the centroid of the markers as the 
# origin of the rigid body frame--I have no control over it.

# gripper base frame (due to how the optitrack is set up, and how I oriented the gripper to calibrate it):
# x - forward
# y - up
# z - right

# gopro frame:
# x - right
# y - down
# z - forward

# world frame:
# x - right
# y - forward
# z - up

# gripper base origin is at the center of the front edge of the gripper base.
# calibrated by placing gripper base origin at optitrack origin.
T_gripper_base_to_optitrack_rigid_body:
  translation: [-0.071377, 0.17301, 0.048436] # meters
  rotation: [ -0.267789, 0.958962, -0.000048, 0.093174 ] # quaternion

# measured approximately irl + in onshape
T_gripper_base_to_gopro:
  translation: [-.049, 0.21, 0.0] # meters
  # rotation: [ 0, 0, -0.7071068, 0.7071068 ] # quaternion
  # rotation: [ 0.5, -0.5, 0.5, -0.5 ]
  rotation: [ 0.7071068, 0, 0.7071068, 0 ]

# The canonical body frame every exported pose is expressed at (preprocessing step 5).
# in other words, this is the "pose" that the model knows about.
# This transform goes from the gopro's camera frame in optical coordinates (exactly as outputted by
# ORB-SLAM3) to gripper fingertips, as measured in the PolyUMI CAD assembly.
# To be more specific:
# - "camera frame" origin is measured on the CAD as the centerpoint of the GoPro lens faceplate, 
#   with a 5mm fudge factor added to guess at where the sensor plane is (.209->.259)
# - "gripper fingertips" is the midpoint between the two gripper fingertips, on the plane of the upper 
#   surface of the fingers. In other words, if you close the gripper all the way, it's the point where the
#   two fingertips meet that is coplanar with the QR codes.

# I picked this canonical body frame because A. it follows roughly UMI's approach
# and B. this is where the gripper interacts with objects, and this may make the model learn
# to reason about contact & manipulation more easily since it can sort of work directly in manipulanda space,
# rather than have to learn about the geometry of the gripper.

# the CAD is designed such that this geometric relationship is the same for both the gripper
# and the franka end effector.
T_gopro_to_fingertip:
  translation: [0.0, 0.014, 0.259] # meters — gopro frame: x right, y down, z forward
  # we'll work in optical coordinates (ie z out, x right, y down); no reason to change from SLAM output
  rotation: [ 0.0, 0.0, 0.0, 1.0 ] # quaternion (xyzw)


T_optitrack_to_world:
  translation: [0.0, 0.0, 0.0] # meters
  # for z along the floor
  rotation: [ 0.5, 0.5, 0.5, -0.5 ]
  # rotation: [0, 0, 0, 1] # quaternion

gripper_fingers:
  # calibrated experimentally.
  closed_mm: 5.0 # mm between the finger tags when closed
  open_mm: 100.0 # mm between the finger tags when open

# ArUco markers placed on the gripper fingers, used by the gripper-width
# preprocessing step (aruco_step.py) to derive a 1DOF gripper width from
# the GoPro video. IDs / size follow the UMI convention (left=0, right=1, 16mm).
aruco_finger_tags:
  dictionary: DICT_4X4_50
  left_id: 0
  right_id: 1
  marker_size_m: 0.016
  nominal_z_m: 0.072    # expected depth of finger tags from GoPro (metres)
  z_tolerance_m: 0.008  # acceptance window around nominal_z (metres)