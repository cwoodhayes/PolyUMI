# Thresholds for automatically flagging an episode as unusable.
#
# These are POLICY, not data. Verdicts are derived at read time from the metrics
# already stored in each episode's `annotations/slam` attrs, so editing this file
# reclassifies every scene immediately — nothing is written into the pzarr and no
# reprocessing is needed. Consumed by the catalog UI (episode_quality.py) and by
# DP export (export/dp/buffer.py), which share one rule so the UI can't disagree
# with what actually gets exported.
#
# An episode explicitly listed in a scene's scene.json `unusable_episodes` is
# unusable regardless of what's here; these thresholds only add to that set.
#
# The two counts below deliberately mirror upstream UMI's
# scripts_slam_pipeline/06_generate_dataset_plan.py, which drops a demo outright
# rather than exporting around a patchy trajectory. Since pzarr v4 we no longer
# interpolate over tracking gaps, so an episode that keeps losing the map has
# nothing standing in for the frames it lost — dropping it is the honest outcome.

# Maximum number of lost frames before the whole episode is unusable. An absolute
# count, not a fraction: UMI's judgement is that a demo which loses tracking at all
# is suspect, however long it happens to be.
#
# Counted on the frames SLAM was actually *fed*, never on the full GoPro grid. Under
# `localization_frame_stride: 2` the localizer never sees odd frames, so the
# whole-grid `n_frames_lost` is ~half the episode even for a flawless run and this
# threshold would reject the entire corpus.
max_lost_frames: 10

# Minimum number of tracked frames for the episode to be worth keeping at all.
# Guards the degenerate case the count above cannot see: an episode that tracked
# almost nothing has few lost frames simply because it is short.
min_tracked_frames: 60

# Both counts are measured over the post-chirp window — the end of the sync chirp to
# the end of the episode — because that is the span the exporter actually ships. The
# idle prefix before the chirp is where the localizer is still relocalizing, and
# condemning an episode for gaps in footage that never reaches the dataset costs real
# demos: measured across 246 episodes, 61% survive when judged over the whole
# recording against 65% over the exported window.
#
# Stores written before pzarr v4 have no post-chirp counts; quality.py falls back to
# the whole-episode fed-frame count for those and says so in the reason string.

# Largest tolerated position step (metres) between two adjacent tracked frames, written by
# step 5 into `annotations/slam` as `max_pose_jump_m`. Catches what the frame counts
# structurally cannot: an episode can be fed every frame, lose none, report tracking_ratio
# 1.000, and still teleport a metre when the localizer relocalizes against the wrong part of
# the map.
#
# 0.08 sits in a real gap in the data: 93 of 97 episodes across three clean scenes peak at
# 6.2 cm or below (p50 3.4, p95 5.9), and the next value up is 10.6 cm. It is a ceiling on
# plausible hand speed, not a tuning knob — at the 30 Hz fed rate, 8 cm/frame is 2.4 m/s.
#
# Measured on the hand frame, not the camera's: that is what the policy consumes, and the
# lever arm amplifies orientation glitches the camera position never sees — p_hand =
# p_cam + R_cam·t with |t| = 0.2685 m, so an orientation flip alone moves the hand up to 54 cm.
max_pose_jump_m: 0.08

# Episodes with OptiTrack poses available (eef.attrs['available_sources']) skip
# the checks above entirely — their pose source doesn't depend on SLAM.
optitrack_always_usable: true

# Advisory only: drives the "low" badge in the catalog UI. Does NOT make an
# episode unusable. Kept separate so the warning threshold and the exclusion
# threshold can move independently.
low_tracking_ratio: 0.90
