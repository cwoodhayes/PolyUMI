# PolyUMI's own ros2_control controllers, declared for the NUC's controller_manager.
#
# Loaded by the spawner in fr3_inference.launch.py. Kept out of franka_bringup's controllers.yaml
# because that file belongs to the franka_ros2 submodule and would be clobbered on every update.
#
# The controller is spawned INACTIVE. It claims the same <joint>/effort command interfaces as
# fr3_arm_controller, so exactly one of the two can run: activating this one deactivates MoveIt's
# path to the arm. See docs/franka-inference-bringup.md.

# NOTE: the spawner does NOT read this block. Humble's spawner sets the `type` param only from its
# -t argument; --param-file sets the controller's `params_file` and never extracts a type. This
# declaration is here because it is what controller_manager reads when a yaml is loaded into the
# manager itself, which is how a controller declared in franka_bringup's controllers.yaml works.
# Ours is spawned by hand against an already-running manager, so -t is what does the work.
controller_manager:
  ros__parameters:
    polyumi_cartesian_impedance_controller:
      type: polyumi_fr3_controllers/CartesianImpedanceController

polyumi_cartesian_impedance_controller:
  ros__parameters:
    arm_id: fr3
    base_frame: fr3_link0
    # The policy's body frame. NOT fr3_hand_tcp, which is where franka reports O_T_EE — the
    # controller moves both the measured pose and the Jacobian onto this frame using TF, so
    # nuc/tcp_calib.py stays the one definition of the geometry.
    tcp_frame: polyumi_tcp
    target_topic: /polyumi/target_poses_traj

    # --- Impedance gains ---
    # SERL's shipped defaults (rail-berkeley/serl_franka_controllers), Panda-tuned. Retune the
    # nullspace tier on the FR3.
    #
    # Why not UMI/polymetis's softer 750 N/m: SERL pairs a HIGH stiffness with a tight error clip,
    # so tracking stays accurate while commanded force saturates at stiffness * clip = 20 N. UMI's
    # spring is softer but unbounded, so a policy commanding an unreachable pose leans on the
    # environment with everything the arm has. For contact-rich tasks the bounded version is what
    # we want. Raising translational_clip raises the force ceiling proportionally — that is the
    # single knob to turn if the arm feels too weak against a surface.
    translational_stiffness: 2000.0
    translational_damping: 89.0       # ~critical for 2000 N/m: 2*sqrt(2000) = 89.4
    rotational_stiffness: 150.0
    rotational_damping: 7.0           # deliberately under-damped; SERL and UMI both run rotation soft
    translational_clip: 0.01          # metres -> 20 N ceiling at the stiffness above
    rotational_clip: 0.05             # radians

    # Off. Steady-state error under load is what it would buy, and we have not seen that yet.
    translational_ki: 0.0
    rotational_ki: 0.0

    # Resolves the 7th DOF. Joint 1 gets its own much stiffer tier so the base rotation is pinned
    # while the elbow floats. Note the projector uses a DAMPED pseudo-inverse, so a few percent of
    # this torque does reach the end effector — raising it far starts fighting the policy.
    nullspace_stiffness: 0.2
    joint1_nullspace_stiffness: 100.0

    # Ceiling on how fast the equilibrium point may travel, and so on how far it can run ahead of
    # the arm. UMI leaves both unbounded; we do not, because that lead is what sets contact force
    # alongside the clip.
    max_pos_speed: 1.0                # m/s
    max_rot_speed: 3.14               # rad/s
