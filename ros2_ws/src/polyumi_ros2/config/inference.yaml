# policy_client_node inference config: control cadence + per-component system latencies.
# Loaded by inference_demo.launch.xml via `<param from="...">`. This is the single place to
# tune how the on-arm inference loop runs; the node's own declared defaults mirror these.

/**:
  ros__parameters:
    # Receding-horizon stride: run inference once per this many control ticks, NOT every tick.
    # The obs window still updates every tick (stays dt-spaced); a new action chunk is only
    # requested/published every steps_per_inference ticks, while the arm executes the previous
    # one. This is UMI's scheme (re-infer every ~steps_per_inference*dt) and it stops the
    # per-tick POST/publish storm. 1 = infer every tick. Should be <= n_action_steps.
    steps_per_inference: 6

    # --- Per-component latencies, in seconds. ---
    # !!! NONE OF THESE HAVE BEEN MEASURED — they are plausible guesses. !!!
    # There is no calibration script for them yet; writing one is tracked under "What's left"
    # in docs/franka-inference-bringup.md. They are live on the inference critical path
    # regardless of whether they are right, so treat every value below as provisional.
    latency:
      # Delay from a photon hitting the GoPro sensor to the frame's ROS header stamp:
      # GoPro encode + HDMI out + capture card + USB + v4l2 dequeue. Sets both the TF lookup
      # instant and t_obs for chunk truncation, so it is the most load-bearing value here.
      # Unmeasured - guess (TODO measure)
      gopro: 0.13
      # Finger camera latency. Declared but never consumed — the policy has no tactile input
      # yet (see "What's left" in docs/franka-inference-bringup.md). Left at 0 so it cannot skew
      # anything until it is wired.
      finger_cam: 0.0
      # Piezo mic latency. Declared but never consumed, as above.
      piezo_mic: 0.0
      # Delay from the arm's true EE pose to its measurement appearing on TF.
      proprio: 0.03
      # Delay from publishing a target pose to the arm actually starting to move.
      arm_exec: 0.03
      # Delay from the hand's true aperture to it appearing on /fr3_gripper/joint_states.
      # Kept separate from proprio because the gripper is a different device on its own link and
      # its own (slower, jitterier) topic — UMI splits these too (gripper_action_latency vs
      # robot_action_latency).
      # Unmeasured - placeholder guess.
      gripper: 0.05

    # --- Gripper width conversion. CALIBRATED 2026-08-09. ---
    # The DP exporter subtracts the closed width, so the policy speaks metres of opening from
    # fully closed (UMI's convention). The robot speaks jaw aperture. Three measured quantities:
    #
    #   closed width     0.04456 m   ArUco finger-tag separation with the fingers touching.
    #                                This is gripper_calib.yaml's closed_mm, on the handheld rig.
    #                                (pingest calibrate-gripper, scene d044: 16320 detections, 980
    #                                within 1 mm of the value against 358 expected by chance)
    #   closed aperture  0.0     m   FR3 jaw aperture with the fingers touching -> min_width below
    #   open aperture    0.0816  m   FR3 jaw aperture at full open              -> max_width below
    #                                (ros2 run polyumi_ros2 gripper_range_probe, 3 reps, 0.00 mm
    #                                spread)
    #
    # gripper_min_width_m doubles as the policy->robot offset: policy width 0 means fully closed,
    # and fully closed on the arm is the closed aperture. There is no separate gripper_offset_m —
    # it was always exactly -gripper_min_width_m, so two knobs held one measurement and could be
    # set inconsistently. Since the closed aperture is 0.0 here the conversion is the IDENTITY plus
    # clamping, which is not a placeholder: these fingers meet at the mechanism's true zero, so
    # "opening from closed" and "jaw aperture" are the same quantity. UMI's WSG is in the same
    # position, which is why their inference path converts nothing either. Re-derive with the two
    # commands above after any change to the fingers or tags.
    #
    # Measured reachable aperture, not the Franka Hand's nominal 0-0.0817 m — neither end is
    # readable at runtime (franka_gripper publishes max_width on no topic). Here the fingers turn
    # out not to be the limit at either end: they close to true zero, and 0.0816 is the hand's own
    # maximum (it stopped 0.1 mm short of a 0.0817 clamp, and franka_gripper aborts anything wider).
    #
    # Cross-check, independent of the encoder: closed width + open aperture = 126.2 mm of tag
    # separation at full open, against the 132.3 mm the handheld reaches. The handheld opens 6.2 mm wider,
    # so the top ~7% of the policy's commanded range saturates here. That shows up as intent
    # clipping, not an error, and is inherent to the two mechanisms having different strokes.
    gripper_max_width_m: 0.0816
    gripper_min_width_m: 0.0

    buffers:
      # How far back (seconds) the EE-pose TF buffer retains history, so a past pose can
      # still be looked up/interpolated to align with a delayed observation (e.g. the gopro
      # frame). Must be >= the largest latency above that gets compensated for.
      ee_pose_s: 1.0
