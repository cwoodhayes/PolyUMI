[tool.ruff]
line-length = 120
# external/ holds third-party git submodules (ORB-SLAM3, franka_ros2, and the UMI
# diffusion-policy fork). They carry their own upstream style, and reformatting them
# would make every rebase onto upstream a conflict. They were ~99% of ruff's findings.
extend-exclude = ["external"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "D", "W"]
ignore = [
    "D203",  # one-blank-line-before-class, conflicts with D211
    "D212",  # multi-line-summary-second-line, conflicts with D212
    "E203",  # whitespace before ':'
    "E402",
    "F401",  # unused import
    "F403",  # from ... import * used; unable to detect undefined names
    "D105",  # missing docstring in magic method
]

# inference_server is intentionally NOT a workspace member: it is meant to run
# isolated on a standalone GPU/inference machine, so it keeps its own
# inference_server/.venv with a minimal dep set (fastapi/uvicorn/numpy).
[tool.uv.workspace]
members = ["ingest", "catalog"]

[tool.uv.sources]
polyumi_pi = { path = "pi", editable = true }

[dependency-groups]
dev = [
    "picamera2",
    "pytest>=9.0.2",
    "httpx",
    "ipykernel",
    "jupyterlab",
    "ipympl>=0.10.0",
    "plotly>=6.9.0",
]
