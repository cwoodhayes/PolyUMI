[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyumi_inference"
version = "0.1.0"
description = "PolyUMI inference protocol: the observation wire format and both ends of it"
# 3.9, not 3.12, because the diffusion-policy container's conda env is python=3.9 (numpy 1.24) and
# imports this library, while the ROS node imports it under 3.12. Every module carries
# `from __future__ import annotations` so the floor is enforceable without a 3.9 interpreter here;
# test_python39_floor.py checks that.
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
]

# The two ends have disjoint dependencies, and each machine installs only its own. The ROS laptop
# gets no fastapi; the policy container gets no HTTP client.
[project.optional-dependencies]
client = ["requests>=2.28"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.0"]

[project.scripts]
dummy-server = "polyumi_inference.dummy_server:main"

[dependency-groups]
dev = [
    "polyumi_inference[client,server]",
    "pytest>=8.0",
    # httpx is what fastapi's TestClient drives the app through -- which is how the client and the
    # server get tested against each other in one process (polyumi_inference.testing).
    "httpx>=0.27",
]

[tool.uv]
# So `uv sync` here installs the package itself, extras and all, rather than only its deps.
default-groups = ["dev"]
